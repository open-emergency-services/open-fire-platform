<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Fire Platform — Hydrant Inspection</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#2a3140; --text:#e6edf3; --muted:#8b98a9;
    --accent:#4aa3ff; --ok:#3fb950; --warn:#d29922; --bad:#ff3b30;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header a { color:var(--accent); font-size:12px; text-decoration:none; }
  .spacer { flex:1; }
  main { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px; max-width:1100px; margin:0 auto; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select, textarea { width:100%; background:#0e131b; border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:8px 9px; font:inherit; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .check input { width:auto; }
  button { margin-top:14px; width:100%; background:var(--accent); color:#04122b; border:0; border-radius:8px;
    padding:10px; font-weight:700; cursor:pointer; }
  .msg { margin-top:10px; font-size:13px; min-height:18px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .pill { font-size:10px; padding:1px 7px; border-radius:10px; }
  .pill.ok { background:rgba(63,185,80,.15); color:var(--ok); }
  .pill.bad { background:rgba(255,59,48,.15); color:var(--bad); }
  .empty { color:var(--muted); padding:8px 0; }
  .api { color:var(--muted); font-size:11px; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
<header>
  <h1>🚒 Hydrant Inspection</h1>
  <a href="index.html">← live incident view</a>
  <div class="spacer"></div>
  <span class="api" id="apiLabel"></span>
</header>

<main>
  <section class="card">
    <h2>New inspection</h2>
    <form id="form">
      <label>Hydrant ID</label>
      <input name="hydrant_id" placeholder="H-1042" required />
      <div class="row">
        <div><label>Inspection date</label><input name="inspection_date" type="date" /></div>
        <div><label>Main size (in)</label><input name="main_size" type="number" step="0.5" /></div>
      </div>
      <div class="row">
        <div><label>Latitude</label><input name="latitude" type="number" step="0.000001" /></div>
        <div><label>Longitude</label><input name="longitude" type="number" step="0.000001" /></div>
      </div>
      <label>Impediment type (comma-separated)</label>
      <input name="impediment_type" placeholder="OBSTRUCTED, LEAKING" />
      <label>NFPA rating color</label>
      <input name="nfpa_rating_color" placeholder="BLUE" />
      <div class="check"><input type="checkbox" name="operable" checked /><label style="margin:0">Operable</label></div>
      <div class="check"><input type="checkbox" name="functional_impediment" /><label style="margin:0">Functional impediment</label></div>
      <div class="check"><input type="checkbox" name="maintenence_referred" /><label style="margin:0">Maintenance referred</label></div>
      <div class="check"><input type="checkbox" name="private_hydrant" /><label style="margin:0">Private hydrant</label></div>
      <label>Notes</label>
      <textarea name="notes" rows="2" placeholder="Flow good; cap replaced."></textarea>
      <button type="submit" id="submitBtn">Save inspection</button>
      <button type="button" id="cancelBtn" style="display:none;background:#2a3140;color:var(--text);">Cancel edit</button>
      <div class="msg" id="msg"></div>
    </form>
  </section>

  <section class="card">
    <h2>Recorded inspections</h2>
    <div class="check" style="margin:0 0 8px;">
      <input type="checkbox" id="showDeleted" />
      <label style="margin:0" for="showDeleted">Show deleted (voided) records</label>
    </div>
    <div id="list"><div class="empty">None yet.</div></div>
  </section>
</main>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var API = params.get('api') || 'http://localhost:3000/api/v1';
  document.getElementById('apiLabel').textContent = API;
  var form = document.getElementById('form'), msg = document.getElementById('msg');
  var submitBtn = document.getElementById('submitBtn'), cancelBtn = document.getElementById('cancelBtn');
  var records = [];            // last-loaded list
  var editing = null;          // { id, version } when editing, else null

  function num(v){ return v === '' || v == null ? undefined : Number(v); }
  function arr(v){ return v ? v.split(',').map(function(s){return s.trim();}).filter(Boolean) : undefined; }

  function formData() {
    var f = new FormData(form);
    var data = {
      hydrant_id: f.get('hydrant_id') || undefined,
      inspection_date: f.get('inspection_date') || undefined,
      main_size: num(f.get('main_size')),
      latitude: num(f.get('latitude')),
      longitude: num(f.get('longitude')),
      impediment_type: arr(f.get('impediment_type')),
      nfpa_rating_color: arr(f.get('nfpa_rating_color')),
      operable: form.operable.checked,
      functional_impediment: form.functional_impediment.checked,
      maintenence_referred: form.maintenence_referred.checked,
      private_hydrant: form.private_hydrant.checked,
      notes: f.get('notes') || undefined
    };
    Object.keys(data).forEach(function(k){ if (data[k] === undefined) delete data[k]; });
    return data;
  }

  function resetForm() {
    form.reset(); form.operable.checked = true; editing = null;
    submitBtn.textContent = 'Save inspection'; cancelBtn.style.display = 'none';
  }
  cancelBtn.addEventListener('click', resetForm);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = formData();
    var url, method;
    if (editing) {
      // Edit → PATCH; append an `updated` event, with optimistic-concurrency version.
      url = API + '/hydrant-inspections/' + editing.id + '?expectedVersion=' + editing.version;
      method = 'PATCH';
    } else {
      url = API + '/hydrant-inspections'; method = 'POST';
    }
    fetch(url, { method: method, headers: { 'content-type':'application/json' }, body: JSON.stringify(data) })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status + (r.status===409?' (someone else edited this — reload)':'')); return r.json(); })
      .then(function(){ msg.className='msg ok'; msg.textContent = editing ? 'Updated.' : 'Saved.'; resetForm(); load(); })
      .catch(function(err){ msg.className='msg err'; msg.textContent = (editing?'Update':'Save')+' failed: ' + err.message; });
  });

  function startEdit(id) {
    var rec = records.find(function(r){ return r.id === id; }); if (!rec) return;
    var d = rec.data || {};
    form.hydrant_id.value = d.hydrant_id || ''; form.inspection_date.value = d.inspection_date || '';
    form.main_size.value = d.main_size != null ? d.main_size : ''; form.latitude.value = d.latitude != null ? d.latitude : '';
    form.longitude.value = d.longitude != null ? d.longitude : '';
    form.impediment_type.value = (d.impediment_type||[]).join(', '); form.nfpa_rating_color.value = (d.nfpa_rating_color||[]).join(', ');
    form.operable.checked = d.operable !== false; form.functional_impediment.checked = !!d.functional_impediment;
    form.maintenence_referred.checked = !!d.maintenence_referred; form.private_hydrant.checked = !!d.private_hydrant;
    form.notes.value = d.notes || '';
    editing = { id: id, version: rec.version };
    submitBtn.textContent = 'Update (v' + rec.version + ')'; cancelBtn.style.display = 'block';
    msg.className='msg'; msg.textContent=''; window.scrollTo(0,0);
  }

  function del(id) {
    var rec = records.find(function(r){ return r.id === id; }); if (!rec) return;
    if (!confirm('Delete this inspection? (history is kept in the log)')) return;
    fetch(API + '/hydrant-inspections/' + id + '?expectedVersion=' + rec.version, { method:'DELETE' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(){ msg.className='msg ok'; msg.textContent='Deleted.'; if (editing && editing.id===id) resetForm(); load(); })
      .catch(function(err){ msg.className='msg err'; msg.textContent='Delete failed: ' + err.message; });
  }

  var showDeleted = document.getElementById('showDeleted');
  showDeleted.addEventListener('change', load);

  function load() {
    var url = API + '/hydrant-inspections' + (showDeleted.checked ? '?includeDeleted=1' : '');
    fetch(url).then(function(r){ return r.json(); }).then(function(list){
      records = (list || []).filter(function(r){ return !r.deleted; }); // editable set for startEdit/del
      var all = list || [];
      var box = document.getElementById('list');
      if (!all.length){ box.innerHTML = '<div class="empty">None yet.</div>'; return; }
      var rows = all.map(function(rec){
        var d = rec.data || {};
        if (rec.deleted) {
          // Voided row: kept and shown, not vanished — its id still resolves (ADR-0007).
          return '<tr style="opacity:.55;"><td style="text-decoration:line-through;">'+ (d.hydrant_id||'—') +
                 '</td><td>'+ (d.inspection_date||'—') +'</td><td><span class="pill bad">deleted</span></td>'+
                 '<td colspan="2" style="font-style:italic;color:var(--muted);">record voided — '+
                 (rec.deletedReason ? 'reason: '+rec.deletedReason : 'no reason given') +'</td>'+
                 '<td style="white-space:nowrap;"><a href="#" data-hist="'+rec.id+'" style="color:var(--muted);">history</a></td></tr>';
        }
        var op = d.operable === false ? '<span class="pill bad">out of service</span>' : '<span class="pill ok">operable</span>';
        return '<tr><td>'+ (d.hydrant_id||'—') +'</td><td>'+ (d.inspection_date||'—') +'</td><td>'+ op +
               '</td><td>'+ ((d.impediment_type||[]).join(', ')||'—') +'</td><td>'+ (d.notes||'') +
               '</td><td style="white-space:nowrap;"><a href="#" data-edit="'+rec.id+'" style="color:var(--accent);">edit</a> · '+
               '<a href="#" data-del="'+rec.id+'" style="color:var(--bad);">delete</a></td></tr>';
      }).join('');
      box.innerHTML = '<table><thead><tr><th>Hydrant</th><th>Date</th><th>Status</th><th>Impediment</th><th>Notes</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
      box.querySelectorAll('[data-edit]').forEach(function(a){ a.onclick=function(e){e.preventDefault();startEdit(a.getAttribute('data-edit'));}; });
      box.querySelectorAll('[data-del]').forEach(function(a){ a.onclick=function(e){e.preventDefault();del(a.getAttribute('data-del'));}; });
      box.querySelectorAll('[data-hist]').forEach(function(a){ a.onclick=function(e){e.preventDefault();showHistory(a.getAttribute('data-hist'));}; });
    }).catch(function(){});
  }

  function showHistory(id) {
    fetch(API + '/hydrant-inspections/' + id + '/history').then(function(r){ return r.json(); }).then(function(h){
      var lines = (h||[]).map(function(e){ return '#'+e.seq+'  '+e.type+'  '+ (e.at||'') + '  by '+ (e.by||'?'); }).join('\n');
      alert('Audit trail for '+id+':\n\n'+lines);
    }).catch(function(){});
  }
  load();
})();
</script>
</body>
</html>
