<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Fire Platform — Sign in</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#2a3140;--text:#e6edf3;--muted:#8b98a9;--accent:#4aa3ff;--ok:#3fb950;--bad:#ff3b30;}
  *{box-sizing:border-box;} body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:340px;}
  h1{font-size:18px;margin:0 0 2px;} .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;}
  input{width:100%;background:#0e131b;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit;}
  button{margin-top:18px;width:100%;background:var(--accent);color:#04122b;border:0;border-radius:8px;padding:11px;font-weight:700;cursor:pointer;}
  .msg{margin-top:12px;font-size:13px;min-height:18px;} .msg.err{color:var(--bad);} .msg.ok{color:var(--ok);}
  .hint{margin-top:14px;font-size:11px;color:var(--muted);} .hint code{color:var(--text);}
  .apirow{margin-top:14px;} .apirow input{font-size:12px;padding:7px 9px;}
  a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <h1>🚒 Open Fire Platform</h1>
  <div class="sub">Sign in</div>
  <form id="f">
    <label>Username</label>
    <input id="u" autocomplete="username" autofocus />
    <label>Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="apirow">
    <label>API base</label>
    <input id="api" placeholder="http://localhost:3000/api/v1" />
  </div>
  <div class="hint">
    Dev seed users: <code>chief / chief123</code>, <code>officer / officer123</code>, <code>ff / ff123</code>.<br/>
    Running SSO (Authentik/Keycloak)? Sign in there instead — this is the built-in fallback.
    <br/><a href="modules.html">← module screens</a>
  </div>
</div>
<script>
(function(){
  function ls(k,v){ try { return v===undefined ? localStorage.getItem(k) : localStorage.setItem(k,v); } catch(e){ return null; } }
  var api = document.getElementById('api');
  api.value = ls('ofp_api') || 'http://localhost:3000/api/v1';
  var msg = document.getElementById('msg');
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var base = api.value.replace(/\/$/,''); ls('ofp_api', base);
    fetch(base+'/auth/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })})
      .then(function(r){ if(!r.ok) throw new Error(r.status===401?'Invalid username or password':'HTTP '+r.status); return r.json(); })
      .then(function(j){ ls('ofp_token', j.token); msg.className='msg ok';
        msg.textContent='Signed in as '+j.principal.departmentId+' ['+j.principal.roles.join(', ')+']. Redirecting…';
        setTimeout(function(){ location.href='modules.html'; }, 700); })
      .catch(function(err){ msg.className='msg err'; msg.textContent=err.message; });
  });
})();
</script>
</body>
</html>
