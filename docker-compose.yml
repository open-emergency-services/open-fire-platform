# Wave-0 footprint: just the API + Postgres. A volunteer department can run this
# on a $10 VPS or a spare box. Larger deployments use the Helm chart (later).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ofp
      POSTGRES_PASSWORD: ofp
      POSTGRES_DB: ofp
    ports:
      - "5432:5432"
    volumes:
      - ofp_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ofp:ofp@db:5432/ofp
      NERIS_BASE_URL: https://api-test.neris.fsri.org/v1
      # Leave NERIS creds unset to run in simulation mode.
      NERIS_CLIENT_ID: ${NERIS_CLIENT_ID:-}
      NERIS_CLIENT_SECRET: ${NERIS_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # The main interface (V1): a static live incident view. Open http://localhost:8080
  # (set OFP_WEB_PORT to publish elsewhere when 8080 is taken on the host).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${OFP_WEB_PORT:-8080}:80"
    depends_on:
      - api

  # The virtual system's event source: plays scenarios into the API as the
  # open-p25-console + CAD would, so the whole chain runs with realistic data.
  # Override the scenario/speed with env, e.g. OFP_SCENARIO=ems-call.
  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    environment:
      OFP_API: http://api:3000/api/v1
      OFP_SCENARIO: ${OFP_SCENARIO:-structure-fire}
      OFP_SPEED: ${OFP_SPEED:-1}
      OFP_LOOP: ${OFP_LOOP:-1}
    depends_on:
      - api

volumes:
  ofp_db:
